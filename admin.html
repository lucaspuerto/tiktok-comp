<title>Admin — Competição TikTok</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #F2EFFA; --card: #FFFFFF; --ink: #17162B; --muted: #6F6C85;
    --accent: #6D43E8; --accent-ink: #FFFFFF; --accent-soft: #EFEAFD;
    --border: #E4E0F2; --border-strong: #CDC7E8;
    --shadow: 0 1px 2px rgba(23, 22, 43, 0.05), 0 6px 20px rgba(109, 67, 232, 0.05);
    --ok: #0B7F58; --ok-soft: #E0F4EC;
    --warn-soft: #FDF3E0; --warn-ink: #A86000;
    --err: #E11D48; --err-soft: #FDE7EC;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D0C1D; --card: #17162E; --ink: #ECEAF8; --muted: #918DAD;
      --accent: #A78BFA; --accent-ink: #14122B; --accent-soft: #241F45;
      --border: #2A2749; --border-strong: #3B3768; --shadow: none;
      --ok: #34D399; --ok-soft: #123227;
      --warn-soft: #33270F; --warn-ink: #D17F00;
      --err: #F43F5E; --err-soft: #38121C;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 80px; }
  .label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 6px; }
  .back { font-size: 13px; }
  .back a { color: var(--muted); text-decoration: none; }
  .back a:hover { color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 18px; margin-top: 18px;
  }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; }
  label.field { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
  .help { font-size: 12px; color: var(--muted); font-weight: 400; display: block; margin-top: 1px; }
  input[type="number"], input[type="password"] {
    width: 100%; border: 1px solid var(--border-strong); background: var(--bg); color: var(--ink);
    border-radius: 10px; padding: 11px 12px; font-size: 15px; font-family: inherit; min-height: 44px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .tier { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .tier input { flex: 1; }
  .tier .x {
    flex: 0 0 44px; min-height: 44px; border: 1px solid var(--border-strong); background: var(--card);
    color: var(--err); border-radius: 10px; font-size: 16px; cursor: pointer;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; border-radius: 12px; min-height: 48px; padding: 0 22px; margin-top: 18px;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; width: 100%;
  }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .btn--ghost { background: none; color: var(--muted); border: 1px solid var(--border-strong); width: auto; min-height: 40px; font-size: 12px; font-weight: 600; }
  .msg { border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-top: 14px; display: none; }
  .msg.ok { display: block; background: var(--ok-soft); color: var(--ok); }
  .msg.err { display: block; background: var(--err-soft); color: var(--err); }
  .note { background: var(--warn-soft); color: var(--warn-ink); border-radius: 12px; padding: 12px 14px; font-size: 12.5px; margin-top: 16px; }
  .muted-note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <div class="label">Admin · Competição TikTok</div>
  <h1>Regras da pontuação</h1>
  <div class="back"><a href="index.html">← voltar pro placar</a></div>
  <div id="app"></div>
</div>

<script>
/* Painel admin: lê e salva tiktok-comp/config.json direto no GitHub via Contents API.
   O token fica SÓ no localStorage deste navegador — nunca vai pro repo nem pra
   terceiros; as chamadas vão direto pra api.github.com. */
const REPO = "lucaspuerto/DRE";
const PATH = "tiktok-comp/config.json";
const BRANCH = "main";
const API = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(PATH)}`;
const TOKEN_KEY = "tiktok-comp-admin-token";

const $ = s => document.querySelector(s);
const state = { token: localStorage.getItem(TOKEN_KEY) || "", config: null, sha: null };

const b64decode = c => new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\s/g, "")), ch => ch.charCodeAt(0)));
const b64encode = s => { const b = new TextEncoder().encode(s); let out = ""; b.forEach(x => out += String.fromCharCode(x)); return btoa(out); };
const headers = () => ({
  "Authorization": `Bearer ${state.token}`,
  "Accept": "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28",
});

/* ── tela de token ── */
function renderTokenView(errMsg) {
  $("#app").innerHTML = `
    <div class="card">
      <h2>Acesso restrito</h2>
      <p class="sub">Cole seu token do GitHub pra carregar e editar as regras. Ele fica salvo só neste navegador.</p>
      <label class="field">Token
        <span class="help">Fine-grained PAT com <b>Contents: Read and write</b> no repo ${REPO}
        (github.com → Settings → Developer settings → Fine-grained tokens)</span>
      </label>
      <input type="password" id="token-input" autocomplete="off" placeholder="github_pat_…">
      <div class="msg err" id="token-err" style="${errMsg ? "display:block" : ""}">${errMsg || ""}</div>
      <button class="btn" id="token-btn">Entrar</button>
    </div>`;
  $("#token-btn").addEventListener("click", () => {
    const t = $("#token-input").value.trim();
    if (!t) return;
    state.token = t;
    localStorage.setItem(TOKEN_KEY, t);
    load();
  });
  $("#token-input").addEventListener("keydown", e => { if (e.key === "Enter") $("#token-btn").click(); });
}

/* ── carregar config ── */
async function load() {
  $("#app").innerHTML = `<div class="card"><p class="sub">Carregando regras atuais…</p></div>`;
  let r;
  try {
    r = await fetch(`${API}?ref=${BRANCH}`, { headers: headers() });
  } catch (e) {
    return renderTokenView("Sem conexão com a API do GitHub — tenta de novo.");
  }
  if (r.status === 401) { localStorage.removeItem(TOKEN_KEY); return renderTokenView("Token inválido ou expirado."); }
  if (r.status === 403 || r.status === 404) {
    localStorage.removeItem(TOKEN_KEY);
    return renderTokenView(`Token sem acesso ao repo ${REPO} (repo privado — o token precisa de Contents: Read and write nele).`);
  }
  if (!r.ok) return renderTokenView(`Erro ${r.status} ao carregar o config.`);
  const data = await r.json();
  state.sha = data.sha;
  try {
    state.config = JSON.parse(b64decode(data.content));
  } catch (e) {
    return renderTokenView("config.json inválido no repo — corrija lá antes de usar o painel.");
  }
  renderForm();
}

/* ── formulário ── */
function tierRow(t) {
  return `
  <div class="tier">
    <input type="number" step="0.1" min="0.1" max="100" value="${100 * t.min_rate}" data-t="rate" placeholder="% mínima" aria-label="Taxa mínima (%)">
    <input type="number" step="1" min="1" value="${t.points}" data-t="pts" placeholder="pontos" aria-label="Pontos do bônus">
    <button class="x" title="Remover faixa" aria-label="Remover faixa">✕</button>
  </div>`;
}

function renderForm() {
  const sc = state.config.scoring || {};
  const eb = sc.engagement_bonus || {};
  const grace = (state.config.month_close || {}).grace_days ?? 3;
  $("#app").innerHTML = `
    <div class="card">
      <h2>Pontos por post</h2>
      <p class="sub">Recompensa a consistência de postagem.</p>
      <div class="grid2">
        <label class="field">Pontos por post
          <input type="number" id="f-ppp" min="0" step="1" value="${sc.points_per_post ?? 100}">
        </label>
        <label class="field">Máx. posts pontuáveis/dia
          <input type="number" id="f-maxday" min="1" step="1" value="${sc.max_scored_posts_per_day ?? 3}">
        </label>
      </div>
      <label class="field">Views mínimas pro post pontuar
        <span class="help">Barra post-fantasma: vídeo abaixo disso não ganha os pontos de post</span>
        <input type="number" id="f-minviews" min="0" step="10" value="${sc.min_views_for_post_points ?? 100}">
      </label>
    </div>

    <div class="card">
      <h2>Pontos por alcance</h2>
      <p class="sub">Views valem ponto, com teto por vídeo pra um viral não decidir o mês sozinho.</p>
      <div class="grid2">
        <label class="field">Pontos a cada 1.000 views
          <input type="number" id="f-per1000" min="0" step="1" value="${sc.points_per_1000_views ?? 10}">
        </label>
        <label class="field">Teto de views por vídeo
          <input type="number" id="f-cap" min="1000" step="1000" value="${sc.views_cap_per_video ?? 500000}">
        </label>
      </div>
    </div>

    <div class="card">
      <h2>Bônus de engajamento</h2>
      <p class="sub">Por vídeo: taxa = (curtidas + comentários + shares) ÷ views. A melhor faixa atingida vale.</p>
      <label class="field">Views mínimas pro vídeo concorrer ao bônus
        <span class="help">Evita ruído estatístico (2 likes num vídeo de 40 views = 5%)</span>
        <input type="number" id="f-ebminviews" min="0" step="100" value="${eb.min_views ?? 1000}">
      </label>
      <label class="field">Faixas <span class="help">% mínima de engajamento → pontos de bônus</span></label>
      <div id="tiers">${(eb.tiers || []).map(tierRow).join("")}</div>
      <button class="btn btn--ghost" id="add-tier" type="button">+ adicionar faixa</button>
      <label class="field">Views mínimas somadas no mês pro ranking de engajamento
        <input type="number" id="f-engrank" min="0" step="100" value="${sc.min_views_for_eng_ranking ?? 1000}">
      </label>
    </div>

    <div class="card">
      <h2>Fechamento do mês</h2>
      <label class="field">Dias de carência após a virada
        <span class="help">Vídeos do fim do mês continuam coletando views por esses dias antes do ranking congelar</span>
        <input type="number" id="f-grace" min="0" max="10" step="1" value="${grace}">
      </label>
    </div>

    <div class="note">⚠️ Mudança de regra <b>re-rankeia o mês corrente inteiro</b> na próxima rodada
    (meses fechados não mudam). Se estiver no meio do mês, avisa o grupo.</div>

    <button class="btn" id="save-btn">Salvar regras</button>
    <div class="msg" id="save-msg"></div>
    <div class="muted-note">Vale a partir da próxima rodada automática (a cada 2h, das 7h às 23h).
      <button class="btn btn--ghost" id="logout" type="button" style="margin-left:8px">esquecer token</button>
    </div>`;

  $("#add-tier").addEventListener("click", () => {
    $("#tiers").insertAdjacentHTML("beforeend", tierRow({ min_rate: 0.15, points: 75 }));
  });
  $("#tiers").addEventListener("click", e => {
    const x = e.target.closest(".x");
    if (x) x.closest(".tier").remove();
  });
  $("#logout").addEventListener("click", () => {
    localStorage.removeItem(TOKEN_KEY); state.token = ""; renderTokenView();
  });
  $("#save-btn").addEventListener("click", save);
}

/* ── salvar ── */
function readForm() {
  const num = (id, fallback) => {
    const v = parseFloat($(id).value);
    return Number.isFinite(v) && v >= 0 ? v : fallback;
  };
  const tiers = [...document.querySelectorAll("#tiers .tier")].map(row => {
    const rate = parseFloat(row.querySelector('[data-t="rate"]').value);
    const pts = parseInt(row.querySelector('[data-t="pts"]').value, 10);
    if (!Number.isFinite(rate) || rate <= 0 || !Number.isFinite(pts) || pts <= 0) return null;
    return { min_rate: Math.round(rate * 10) / 1000, points: pts };
  }).filter(Boolean).sort((a, b) => a.min_rate - b.min_rate);

  return {
    scoring: {
      points_per_post: Math.round(num("#f-ppp", 100)),
      max_scored_posts_per_day: Math.max(1, Math.round(num("#f-maxday", 3))),
      min_views_for_post_points: Math.round(num("#f-minviews", 100)),
      points_per_1000_views: num("#f-per1000", 10),
      views_cap_per_video: Math.round(num("#f-cap", 500000)),
      engagement_bonus: { min_views: Math.round(num("#f-ebminviews", 1000)), tiers },
      min_views_for_eng_ranking: Math.round(num("#f-engrank", 1000)),
    },
    grace_days: Math.round(num("#f-grace", 3)),
  };
}

async function save() {
  const btn = $("#save-btn"), msg = $("#save-msg");
  btn.disabled = true; btn.textContent = "Salvando…"; msg.className = "msg";
  const form = readForm();
  const next = { ...state.config, scoring: form.scoring };
  next.month_close = { ...(state.config.month_close || {}), grace_days: form.grace_days };

  let r;
  try {
    r = await fetch(API, {
      method: "PUT",
      headers: { ...headers(), "Content-Type": "application/json" },
      body: JSON.stringify({
        message: "tiktok-comp: ajusta pontuação via painel admin",
        content: b64encode(JSON.stringify(next, null, 2) + "\n"),
        sha: state.sha,
        branch: BRANCH,
      }),
    });
  } catch (e) {
    btn.disabled = false; btn.textContent = "Salvar regras";
    msg.className = "msg err"; msg.textContent = "Sem conexão com a API do GitHub — tenta de novo.";
    return;
  }
  btn.disabled = false; btn.textContent = "Salvar regras";
  if (r.status === 409 || r.status === 422) {
    msg.className = "msg err";
    msg.textContent = "O config mudou no repo desde que você abriu o painel (rodada automática ou edição manual). Recarregando as regras atuais…";
    setTimeout(load, 1800);
    return;
  }
  if (!r.ok) {
    msg.className = "msg err";
    msg.textContent = `Erro ${r.status} ao salvar. Token com Contents: Read and write no ${REPO}?`;
    return;
  }
  const data = await r.json();
  state.sha = data.content.sha;
  state.config = next;
  msg.className = "msg ok";
  msg.textContent = "✅ Regras salvas! Valem a partir da próxima rodada — o placar do mês corrente será recalculado com elas.";
}

/* ── boot ── */
if (state.token) load(); else renderTokenView();
</script>
