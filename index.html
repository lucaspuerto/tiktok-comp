<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Competição TikTok — Mentorados</title>
<style>
  :root { --bg: #F2EFFA; --card: #FFFFFF; --ink: #17162B; --muted: #6F6C85; --accent: #6D43E8; --border: #E4E0F2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D0C1D; --card: #17162E; --ink: #ECEAF8; --muted: #918DAD; --accent: #A78BFA; --border: #2A2749; }
  }
  body {
    background: var(--bg); color: var(--ink); margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 40px 28px; max-width: 420px; margin: 20px; }
  .big { font-size: 44px; }
  h1 { font-size: 20px; margin: 12px 0 8px; }
  p { color: var(--muted); font-size: 14px; margin: 0; }
  .accent { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="big">🏁</div>
    <h1>Competição TikTok dos Mentorados</h1>
    <p>O placar tá quase no ar — a <span class="accent">primeira rodada</span> de coleta
    publica o leaderboard aqui automaticamente. Volta daqui a pouco.</p>
  </div>
</body>
</html>
