<style>
  :root {
    --bg: #EDF2FA;
    --card: #FFFFFF;
    --ink: #17162B;
    --muted: #6F6C85;
    --accent: #1D6FE0;
    --accent-ink: #FFFFFF;
    --accent-soft: #E4EEFC;
    --border: #E4E0F2;
    --border-strong: #CDC7E8;
    --shadow: 0 1px 2px rgba(23, 22, 43, 0.05), 0 6px 20px rgba(109, 67, 232, 0.05);
    --live: #0B7F58;
    --live-soft: #E0F4EC;
    --warn-soft: #FDF3E0;
    --warn-ink: #A86000;
    /* composição de pontos — paleta categórica validada (light vs #fff) */
    --c-posts: #1D6FE0;
    --c-views: #0089AB;
    --c-bonus: #D61F7F;
    --gold: #A86000;   --gold-soft: #FBEFD7;
    --silver: #5B5874; --silver-soft: #EDEBF6;
    --bronze: #9A4E20; --bronze-soft: #F7E8DD;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08131F; --card: #10202F; --ink: #ECEAF8; --muted: #918DAD;
      --accent: #6FB2FF; --accent-ink: #0A1A2E; --accent-soft: #12294A;
      --border: #2A2749; --border-strong: #3B3768; --shadow: none;
      --live: #34D399; --live-soft: #123227;
      --warn-soft: #33270F; --warn-ink: #D17F00;
      /* composição — variantes validadas vs navy */
      --c-posts: #8B66F7; --c-views: #0E9DB8; --c-bonus: #EC4899;
      --gold: #E0A93E;   --gold-soft: #33270F;
      --silver: #A6A3C0; --silver-soft: #242138;
      --bronze: #D0763B; --bronze-soft: #2E1D12;
    }
  }
  :root[data-theme="light"] {
    --bg: #EDF2FA; --card: #FFFFFF; --ink: #17162B; --muted: #6F6C85;
    --accent: #1D6FE0; --accent-ink: #FFFFFF; --accent-soft: #E4EEFC;
    --border: #E4E0F2; --border-strong: #CDC7E8;
    --shadow: 0 1px 2px rgba(23, 22, 43, 0.05), 0 6px 20px rgba(109, 67, 232, 0.05);
    --live: #0B7F58; --live-soft: #E0F4EC;
    --warn-soft: #FDF3E0; --warn-ink: #A86000;
    --c-posts: #1D6FE0; --c-views: #0089AB; --c-bonus: #D61F7F;
    --gold: #A86000; --gold-soft: #FBEFD7;
    --silver: #5B5874; --silver-soft: #EDEBF6;
    --bronze: #9A4E20; --bronze-soft: #F7E8DD;
  }
  :root[data-theme="dark"] {
    --bg: #08131F; --card: #10202F; --ink: #ECEAF8; --muted: #918DAD;
    --accent: #6FB2FF; --accent-ink: #0A1A2E; --accent-soft: #12294A;
    --border: #2A2749; --border-strong: #3B3768; --shadow: none;
    --live: #34D399; --live-soft: #123227;
    --warn-soft: #33270F; --warn-ink: #D17F00;
    --c-posts: #8B66F7; --c-views: #0E9DB8; --c-bonus: #EC4899;
    --gold: #E0A93E; --gold-soft: #33270F;
    --silver: #A6A3C0; --silver-soft: #242138;
    --bronze: #D0763B; --bronze-soft: #2E1D12;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    margin: 0;
    overflow-x: clip;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 80px; }
  .num { font-variant-numeric: tabular-nums; }

  .label {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .label--accent { color: var(--accent); }

  /* ── header ─────────────────────────────── */
  header { margin-bottom: 18px; }
  .craft-logo { height: 30px; width: auto; display: block; margin-bottom: 10px; filter: invert(1); }
  @media (prefers-color-scheme: dark) { .craft-logo { filter: none; } }
  :root[data-theme="light"] .craft-logo { filter: invert(1); }
  :root[data-theme="dark"] .craft-logo { filter: none; }
  .h-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .h-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 8px; text-wrap: balance; }
  .h-rule {
    width: 88px; height: 3px; border: 0; margin: 0 0 16px; border-radius: 2px;
    background: linear-gradient(90deg, var(--c-posts), var(--c-bonus), var(--c-views));
  }
  .h-meta { font-size: 12px; color: var(--muted); }
  .h-meta strong { color: var(--ink); font-weight: 600; }
  #theme-btn {
    border: 1px solid var(--border-strong); background: var(--card); color: var(--ink);
    border-radius: 10px; min-width: 44px; min-height: 44px; font-size: 17px; cursor: pointer;
  }

  /* ── seletor de mês ─────────────────────── */
  .months { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .months::-webkit-scrollbar { display: none; }
  .m-chip {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--border-strong); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 10px 16px; min-height: 44px; font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .m-chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .m-live {
    font-size: 10px; font-weight: 700; letter-spacing: 0.08em; border-radius: 999px; padding: 2px 7px;
    background: var(--live-soft); color: var(--live);
  }
  .m-chip[aria-pressed="true"] .m-live { background: rgba(255,255,255,0.22); color: inherit; }

  .banner {
    display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 12px 16px; margin: 6px 0 16px;
    background: var(--gold-soft); color: var(--gold); font-weight: 700; font-size: 14px;
  }

  /* ── totais do grupo ────────────────────── */
  .totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 26px; }
  .t-tile {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 14px 8px 12px; text-align: center; min-width: 0;
  }
  .t-tile b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .t-tile .label { font-size: 9.5px; margin-top: 2px; }

  /* ── cards genéricos ────────────────────── */
  section { margin-bottom: 26px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 16px;
  }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 2px; }
  .sub { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

  /* ── pódio ──────────────────────────────── */
  .podium { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); gap: 8px; align-items: end; }
  .p-card { min-width: 0; }
  .p-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
    padding: 14px 8px 12px; text-align: center;
  }
  .p-card.p-1 { border-color: var(--gold); padding-top: 20px; padding-bottom: 18px; }
  .medal {
    width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px;
  }
  .medal-1 { background: var(--gold-soft); color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
  .medal-2 { background: var(--silver-soft); color: var(--silver); box-shadow: inset 0 0 0 2px var(--silver); }
  .medal-3 { background: var(--bronze-soft); color: var(--bronze); box-shadow: inset 0 0 0 2px var(--bronze); }
  .p-name { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .p-handle { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
  .p-pts { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-top: 6px; }
  .p-1 .p-pts { font-size: 24px; color: var(--accent); }
  .p-pts small { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .delta { font-size: 11px; font-weight: 700; }
  .delta.up { color: var(--live); }
  .delta.down { color: var(--c-bonus); }
  .delta.same { color: var(--muted); }

  /* ── placar geral ───────────────────────── */
  .board { width: 100%; border-collapse: collapse; }
  .board th {
    text-align: left; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border);
  }
  .board th:last-child, .board td.pts { text-align: right; }
  .board td { padding: 0; border-bottom: 1px solid var(--border); }
  .board tr:last-child td { border-bottom: 0; }
  .row-main { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 6px; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .rank { flex: 0 0 26px; text-align: center; font-weight: 700; font-size: 13px; color: var(--muted); }
  .rank.r1 { color: var(--gold); } .rank.r2 { color: var(--silver); } .rank.r3 { color: var(--bronze); }
  .row-id { flex: 1 1 auto; min-width: 0; }
  .row-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .comp-bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .comp-bar i { display: block; height: 100%; border-radius: 2px; }
  .comp-posts { background: var(--c-posts); }
  .comp-views { background: var(--c-views); }
  .comp-bonus { background: var(--c-bonus); }
  .row-pts { flex: 0 0 auto; font-size: 15px; font-weight: 800; }
  .row-caret { flex: 0 0 auto; color: var(--muted); font-size: 11px; transition: transform 0.15s; }
  tr.open .row-caret { transform: rotate(90deg); }
  .row-detail { display: none; padding: 2px 10px 14px 42px; }
  tr.open .row-detail { display: block; }
  .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
  .d-item { background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
  .d-item .label { font-size: 9px; }
  .d-item b { font-size: 14px; }
  .d-breakdown { font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: baseline; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 11px; color: var(--muted); }

  /* ── rankings individuais ───────────────── */
  .rk-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .rk-tab {
    flex: 1; border: 1px solid var(--border-strong); background: var(--card); color: var(--muted);
    border-radius: 10px; min-height: 44px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .rk-tab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .rk-row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .rk-name { flex: 0 0 34%; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk-track { flex: 1 1 auto; display: block; height: 10px; border-radius: 5px; background: var(--accent-soft); overflow: hidden; }
  .rk-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
  .rk-val { flex: 0 0 auto; font-size: 12px; font-weight: 700; min-width: 52px; text-align: right; }
  .rk-badge {
    font-size: 9px; font-weight: 700; letter-spacing: 0.05em; border-radius: 999px; padding: 1px 6px;
    background: var(--warn-soft); color: var(--warn-ink); white-space: nowrap;
  }

  /* ── top vídeos do mês ──────────────────── */
  .tv-item { display: flex; gap: 11px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .tv-item:last-child { border-bottom: 0; }
  .tv-pos {
    flex: 0 0 26px; text-align: center; font-size: 14px; font-weight: 800; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .tv-pos.p1 { color: var(--gold); } .tv-pos.p2 { color: var(--silver); } .tv-pos.p3 { color: var(--bronze); }
  .tv-body { flex: 1 1 auto; min-width: 0; display: block; }
  /* display:block é obrigatório: ellipsis não corta texto em elemento inline */
  .tv-cap { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-cap a { color: inherit; text-decoration: none; }
  .tv-cap a:hover { color: var(--accent); }
  .tv-who { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tv-views { flex: 0 0 auto; text-align: right; }
  .tv-views b { display: block; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tv-views .label { display: block; font-size: 9px; }

  /* ── ver mais / ver menos ───────────────── */
  .more-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 44px; margin-top: 10px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--border-strong); background: var(--card); color: var(--accent);
    border-radius: 12px; font-size: 13px; font-weight: 700;
  }
  .more-btn:hover { background: var(--accent-soft); }
  .more-btn .sign { font-size: 16px; line-height: 1; }

  /* ── cards por participante ─────────────── */
  .mentees { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  @media (min-width: 520px) { .mentees { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mentees .card { min-width: 0; }
  .mt-head { display: flex; align-items: center; gap: 10px; }
  .avatar {
    flex: 0 0 40px; width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
    color: var(--accent-ink); position: relative; overflow: hidden;
  }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mt-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt-handle { font-size: 11px; }
  .mt-handle a { color: var(--muted); text-decoration: none; }
  .mt-rank { margin-left: auto; text-align: right; }
  .mt-rank b { font-size: 16px; }
  .mt-rank .label { font-size: 9px; }
  .spark-wrap { margin: 10px 0 4px; }
  .spark { width: 100%; height: 44px; display: block; }
  .mt-stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .mt-stats b { color: var(--ink); }
  .mt-posts { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px solid var(--border); }
  .mt-posts li { margin-bottom: 6px; font-size: 12px; display: flex; gap: 8px; align-items: baseline; }
  .mt-posts a { color: var(--ink); text-decoration: none; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mt-posts a:hover { color: var(--accent); }
  .mt-posts .v { color: var(--muted); flex: 0 0 auto; }

  /* ── avisos / regras / vazio ────────────── */
  .warn-card { background: var(--warn-soft); border: 0; color: var(--warn-ink); font-size: 13px; }
  .warn-card b { display: block; margin-bottom: 4px; }
  .rules { font-size: 13px; color: var(--muted); }
  .rules li { margin-bottom: 6px; }

  .empty { text-align: center; padding: 40px 16px; color: var(--muted); font-size: 14px; }
  .empty .big { font-size: 34px; margin-bottom: 8px; }
  footer { margin-top: 32px; font-size: 11px; color: var(--muted); text-align: center; }

/* ── estado / helpers ─────────────────────── */
const $ = (s, el) => (el || document).querySelector(s);
const state = { month: null, rkTab: "posts", boardOpen: false, rkOpen: false };
const TOP_N = 5;   // placar e rankings abrem no top 5; o resto vem no botão "+"

const moreBtn = (key, total, open) => total <= TOP_N ? "" : `
  <button class="more-btn" data-more="${key}">
    <span class="sign">${open ? "−" : "+"}</span>
    ${open ? `mostrar só o top ${TOP_N}` : `ver todos os ${total}`}
  </button>`;

const fmt = new Intl.NumberFormat("pt-BR");
const fmtC = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
const nf = n => fmt.format(n || 0);
const nc = n => fmtC.format(n || 0);
const pct = r => (100 * (r || 0)).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shortCap = (s, n = 8) => {
  const w = String(s || "").trim().split(/\s+/).filter(Boolean);
  return w.length <= n ? w.join(" ") : w.slice(0, n).join(" ") + "…";
};

const MONTH_NAMES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const monthLabel = m => { const [y, mm] = m.split("-"); return MONTH_NAMES[+mm - 1] + " " + y; };

const AV_COLORS = ["var(--c-posts)", "var(--c-views)", "var(--c-bonus)", "var(--accent)"];
const avColor = h => AV_COLORS[[...h].reduce((a, c) => a + c.charCodeAt(0), 0) % AV_COLORS.length];
const initials = name => name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

function viewFor(month) {
  if (month === DATA.current.month) return { ...DATA.current, closed: false, scoring: DATA.scoring };
  const m = DATA.months.find(x => x.month === month);
  return m ? { ...m, closed: true, scoring: m.scoring_snapshot || DATA.scoring, warnings: null } : null;
}

/* delta de posição vs ontem, a partir da série diária */
function rankDeltas(series, standings) {
  const days = [...new Set(Object.values(series || {}).flat().map(p => p.d))].sort();
  if (days.length < 2) return {};
  const rankAt = d => {
    const pts = standings.map(s => {
      const pt = (series[s.handle] || []).filter(p => p.d <= d).pop();
      return { h: s.handle, p: pt ? pt.points : 0 };
    }).sort((a, b) => b.p - a.p);
    const out = {}; pts.forEach((x, i) => out[x.h] = i + 1); return out;
  };
  const prev = rankAt(days[days.length - 2]), cur = rankAt(days[days.length - 1]);
  const out = {};
  standings.forEach(s => { out[s.handle] = (prev[s.handle] || 0) - (cur[s.handle] || 0); });
  return out;
}

const deltaHTML = d => d == null || d === 0
  ? '<span class="delta same">—</span>'
  : d > 0 ? `<span class="delta up">▲ ${d}</span>` : `<span class="delta down">▼ ${-d}</span>`;

/* ── header ───────────────────────────────── */
function renderUpdated() {
  const gen = new Date(DATA.generated_at);
  const min = Math.max(0, Math.round((Date.now() - gen) / 60000));
  const ago = min < 1 ? "agora mesmo" : min < 60 ? `há ${min} min` : `há ${Math.round(min / 60)} h`;
  $("#updated").innerHTML = `Atualizado <strong>${ago}</strong>`;
}
function renderDaysLeft() {
  const el = $("#days-left");
  if (state.month !== DATA.current.month) { el.textContent = ""; return; }
  const [y, m] = state.month.split("-").map(Number);
  const end = new Date(y, m, 1); // 1º dia do mês seguinte (fuso do leitor ≈ BRT pro público)
  const days = Math.max(0, Math.ceil((end - Date.now()) / 86400000));
  el.innerHTML = ` · <strong>${days}</strong> dia${days === 1 ? "" : "s"} restante${days === 1 ? "" : "s"}`;
}

function renderMonths() {
  const all = [DATA.current.month, ...DATA.months.map(m => m.month)];
  $("#months").innerHTML = all.map(m => `
    <button class="m-chip" aria-pressed="${m === state.month}" data-month="${m}">
      ${monthLabel(m)}${m === DATA.current.month ? ' <span class="m-live">AO VIVO</span>' : ""}
    </button>`).join("");
}

/* ── seções ───────────────────────────────── */
function totalsHTML(v) {
  const t = v.standings.reduce((a, s) => {
    a.posts += s.posts; a.views += s.views;
    a.inter += s.likes + s.comments + s.shares;
    return a;
  }, { posts: 0, views: 0, inter: 0 });
  if (!t.posts && !t.views) return "";
  return `
  <section class="totals">
    <div class="t-tile"><b class="num">${nf(t.posts)}</b><div class="label">Posts do grupo</div></div>
    <div class="t-tile"><b class="num">${nc(t.views)}</b><div class="label">Alcance total</div></div>
    <div class="t-tile"><b class="num">${nc(t.inter)}</b><div class="label">Interações</div></div>
  </section>`;
}

function avatarHTML(s, size) {
  const av = (DATA.avatars || {})[s.handle];
  const img = av ? `<img src="${esc(av)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  return `<div class="avatar" style="background:${avColor(s.handle)}${size ? `;flex-basis:${size}px;width:${size}px;height:${size}px` : ""}">${esc(initials(s.display_name))}${img}</div>`;
}

function podiumHTML(v, deltas) {
  const top = v.standings.slice(0, 3);
  if (!top.length || top.every(s => !s.points)) return "";
  const card = (s, pos) => s ? `
    <div class="p-card p-${pos}">
      <div class="medal medal-${pos}">${pos}º</div>
      <div class="p-name">${esc(s.display_name)}</div>
      <div class="p-handle">@${esc(s.handle)}</div>
      <div class="p-pts num">${nf(s.points)} <small>pts</small></div>
      ${v.closed ? "" : deltaHTML(deltas[s.handle])}
    </div>` : "<div></div>";
  return `<section class="podium">${card(top[1], 2)}${card(top[0], 1)}${card(top[2], 3)}</section>`;
}

function boardHTML(v) {
  const sc = v.scoring || {};
  // componente zerado no painel some da legenda e do detalhe — volta se a regra voltar
  const active = {
    posts: sc.points_per_post > 0,
    views: sc.points_per_1000_views > 0,
    bonus: (((sc.engagement_bonus || {}).tiers) || []).length > 0,
  };
  const max = Math.max(1, ...v.standings.map(s => s.points));
  const shown = state.boardOpen ? v.standings : v.standings.slice(0, TOP_N);
  const rows = shown.map(s => {
    const segs = [["posts", s.points_posts], ["views", s.points_views], ["bonus", s.points_bonus]]
      .filter(([, p]) => p > 0)
      .map(([k, p]) => `<i class="comp-${k}" style="width:${(100 * p / max).toFixed(1)}%" title="${k === "posts" ? "Posts" : k === "views" ? "Views" : "Bônus"}: ${nf(p)} pts"></i>`)
      .join("");
    return `
    <tr data-h="${esc(s.handle)}">
      <td colspan="3">
        <button class="row-main" aria-expanded="false">
          <span class="rank r${s.rank_points} num">${s.rank_points}</span>
          <span class="row-id">
            <span class="row-name">${esc(s.display_name)}</span>
            <span class="comp-bar">${segs}</span>
          </span>
          <span class="row-pts num">${nf(s.points)}</span>
          <span class="row-caret">▶</span>
        </button>
        <div class="row-detail">
          <div class="detail-grid">
            <div class="d-item"><div class="label">Posts</div><b class="num">${nf(s.posts)}</b></div>
            <div class="d-item"><div class="label">Views</div><b class="num">${nc(s.views)}</b></div>
            <div class="d-item"><div class="label">Engaj.</div><b class="num">${s.views ? pct(s.eng_rate) : "—"}</b></div>
          </div>
          <div class="d-breakdown">${[
            active.posts && `<span class="dot comp-posts"></span>Posts: <b class="num">${nf(s.points_posts)}</b>`,
            active.views && `<span class="dot comp-views"></span>Views: <b class="num">${nf(s.points_views)}</b>`,
            active.bonus && `<span class="dot comp-bonus"></span>Bônus: <b class="num">${nf(s.points_bonus)}</b>`,
          ].filter(Boolean).join(" · ")}</div>
        </div>
      </td>
    </tr>`;
  }).join("");
  return `
  <section>
    <div class="card">
      <h2>Placar geral</h2>
      <p class="sub">Pontos combinados — toca numa linha pra ver o detalhe</p>
      <table class="board">
        <thead><tr><th style="width:26px">#</th><th>Participante</th><th>Pts</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${moreBtn("board", v.standings.length, state.boardOpen)}
      ${[active.posts, active.views, active.bonus].filter(Boolean).length > 1 ? `<div class="legend">${[
        active.posts && '<span><span class="dot comp-posts"></span>pts de posts</span>',
        active.views && '<span><span class="dot comp-views"></span>pts de views</span>',
        active.bonus && '<span><span class="dot comp-bonus"></span>bônus de engajamento</span>',
      ].filter(Boolean).join("")}</div>` : ""}
    </div>
  </section>`;
}

function rankingsHTML(v) {
  const cfg = {
    posts: { title: "Posts", val: s => s.posts, fmtv: s => nf(s.posts), sort: s => [s.posts, s.points] },
    views: { title: "Views", val: s => s.views, fmtv: s => nc(s.views), sort: s => [s.views, s.points] },
    eng:   { title: "Engajamento", val: s => s.eng_eligible ? s.eng_rate : 0, fmtv: s => pct(s.eng_rate), sort: s => [s.eng_eligible ? 1 : 0, s.eng_rate] },
  }[state.rkTab];
  const minViews = (v.scoring || {}).min_views_for_eng_ranking || 1000;
  const sorted = [...v.standings].sort((a, b) => {
    const [a1, a2] = cfg.sort(a), [b1, b2] = cfg.sort(b);
    return b1 - a1 || b2 - a2;
  });
  const max = Math.max(1e-9, ...sorted.map(cfg.val));
  const rkShown = state.rkOpen ? sorted : sorted.slice(0, TOP_N);
  const rows = rkShown.map((s, i) => {
    const inel = state.rkTab === "eng" && !s.eng_eligible;
    return `
    <div class="rk-row">
      <span class="rank num" style="flex:0 0 22px;text-align:center">${i + 1}</span>
      <span class="rk-name">${esc(s.display_name)}</span>
      ${inel
        ? `<span class="rk-track"></span><span class="rk-badge">mín. ${nc(minViews)} views</span>`
        : `<span class="rk-track"><span class="rk-fill" style="width:${(100 * cfg.val(s) / max).toFixed(1)}%"></span></span>
           <span class="rk-val num">${cfg.fmtv(s)}</span>`}
    </div>`;
  }).join("");
  return `
  <section>
    <div class="card">
      <h2>Rankings do mês</h2>
      <p class="sub">Quem mais postou · maior alcance · maior engajamento</p>
      <div class="rk-tabs">
        ${["posts", "views", "eng"].map(k => `<button class="rk-tab" data-rk="${k}" aria-pressed="${k === state.rkTab}">${{ posts: "Posts", views: "Views", eng: "Engajamento" }[k]}</button>`).join("")}
      </div>
      <div>${rows}</div>
      ${moreBtn("rk", sorted.length, state.rkOpen)}
    </div>
  </section>`;
}

function sparkSVG(points) {
  if (!points || points.length < 2) return "";
  const w = 260, h = 44, pad = 3;
  const max = Math.max(1, ...points.map(p => p.points));
  const xs = i => pad + i * (w - 2 * pad) / (points.length - 1);
  const ys = p => h - pad - (p.points / max) * (h - 2 * pad);
  const d = points.map((p, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)},${ys(p).toFixed(1)}`).join("");
  const last = points[points.length - 1];
  return `
  <svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Evolução diária de pontos, fechando em ${nf(last.points)}">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${xs(points.length - 1).toFixed(1)}" cy="${ys(last).toFixed(1)}" r="3.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
}

function topVideosHTML(v) {
  const tv = v.top_videos || [];
  if (!tv.length || !tv[0].views) return "";
  const linhas = tv.filter(t => t.views > 0).map((t, i) => `
    <div class="tv-item">
      <span class="tv-pos p${i + 1}">${i + 1}</span>
      <span class="tv-body">
        <span class="tv-cap"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(shortCap(t.caption, 7) || "ver no TikTok")}</a></span>
        <span class="tv-who">${esc(t.display_name)}</span>
      </span>
      <span class="tv-views"><b class="num">${nc(t.views)}</b><span class="label">views</span></span>
    </div>`).join("");
  return `
  <section>
    <div class="card">
      <h2>Vídeos mais vistos do mês</h2>
      <p class="sub">O top ${tv.length} do grupo inteiro — não importa quem postou</p>
      ${linhas}
    </div>
  </section>`;
}

function menteesHTML(v) {
  const cards = v.standings.map(s => {
    const series = (v.daily_series || {})[s.handle] || [];
    const posts = (s.top_videos || []).map(tv => `
      <li><a href="${esc(tv.url)}" target="_blank" rel="noopener">${esc(shortCap(tv.caption) || "ver no TikTok")}</a><span class="v num">${nc(tv.views)} views</span></li>`).join("");
    return `
    <div class="card">
      <div class="mt-head">
        ${avatarHTML(s)}
        <div style="min-width:0">
          <div class="mt-name">${esc(s.display_name)}</div>
          <div class="mt-handle"><a href="https://www.tiktok.com/@${esc(s.handle)}" target="_blank" rel="noopener">@${esc(s.handle)}</a></div>
        </div>
        <div class="mt-rank"><b class="num">${s.rank_points}º</b><div class="label">${nf(s.points)} pts</div></div>
      </div>
      ${series.length > 1 ? `<div class="spark-wrap">${sparkSVG(series)}</div>` : ""}
      <div class="mt-stats">
        <span><b class="num">${nf(s.posts)}</b> posts</span>
        <span><b class="num">${nc(s.views)}</b> views</span>
        <span><b class="num">${s.views ? pct(s.eng_rate) : "—"}</b> engaj.</span>
      </div>
      ${posts ? `<ul class="mt-posts">${posts}</ul>` : ""}
    </div>`;
  }).join("");
  return `<section><h2 style="margin-bottom:10px">Participantes</h2><div class="mentees">${cards}</div></section>`;
}

function warningsHTML(v) {
  const w = v.warnings;
  if (!w) return "";
  const parts = [];
  if ((w.missing_profiles || []).length)
    parts.push(`Ainda sem vídeos coletados: ${w.missing_profiles.map(h => "@" + esc(h)).join(", ")}`);
  if ((w.unknown_handles || []).length)
    parts.push(`Handles fora da lista: ${w.unknown_handles.map(h => "@" + esc(h)).join(", ")}`);
  if (!parts.length) return "";
  return `<section><div class="card warn-card"><b>⚠️ Avisos</b>${parts.map(p => `<div>${p}</div>`).join("")}</div></section>`;
}

function rulesHTML(v) {
  const sc = v.scoring || {};
  const eb = sc.engagement_bonus || {};
  const tiers = (eb.tiers || []).map(t => `${pct(t.min_rate)} → +${nf(t.points)} pts`).join(" · ");
  const items = [];
  if (DATA.count_start && v.month === DATA.current.month) {
    const [, mm, dd] = DATA.count_start.split("-");
    items.push(`<li><b>A contagem vale a partir de ${dd}/${mm}</b> — vídeos postados antes dessa data não pontuam.</li>`);
  }
  if (sc.points_per_post > 0) {
    const minV = sc.min_views_for_post_points > 0 ? `, e o vídeo precisa de pelo menos ${nf(sc.min_views_for_post_points)} views` : "";
    items.push(`<li><span class="dot comp-posts"></span><b>+${nf(sc.points_per_post)} pts por post</b> no mês — no máximo ${sc.max_scored_posts_per_day} posts pontuáveis por dia${minV}.</li>`);
  }
  if (sc.points_per_1000_views > 0)
    items.push(`<li><span class="dot comp-views"></span><b>+${nf(sc.points_per_1000_views)} pts a cada 1.000 views</b> — contando até ${nc(sc.views_cap_per_video)} views por vídeo.</li>`);
  if (tiers)
    items.push(`<li><span class="dot comp-bonus"></span><b>Bônus de engajamento</b> por vídeo com ${nc(eb.min_views)}+ views: taxa (curtidas+comentários+shares ÷ views) de ${tiers}.</li>`);
  if (sc.min_views_for_eng_ranking > 0)
    items.push(`<li>Ranking de engajamento: só entra quem tem ${nc(sc.min_views_for_eng_ranking)}+ views somadas no mês.</li>`);
  items.push(`<li>Cada publicação conta uma única vez, dentro do mês vigente. O ranking zera todo mês.</li>`);
  items.push(`<li>Desempate, nesta ordem: nº de vídeos publicados no período → total de views nos vídeos válidos → critério adicional definido pela equipe Craft.</li>`);
  return `
  <section>
    <div class="card">
      <h2>Como funciona a pontuação</h2>
      <ul class="rules">${items.join("")}</ul>
    </div>
  </section>`;
}

/* ── render principal ─────────────────────── */
function render() {
  const v = viewFor(state.month);
  renderMonths();
  renderDaysLeft();
  const banner = $("#banner");
  banner.innerHTML = v && v.closed && v.winner
    ? `<div class="banner"><span class="medal medal-1" style="margin:0;width:28px;height:28px;font-size:11px">1º</span> CAMPEÃO DE ${monthLabel(v.month).toUpperCase()}: ${esc(v.winner.display_name)} — ${nf(v.winner.points)} pts</div>`
    : "";
  const main = $("#main");
  if (!v || !v.standings.length) {
    main.innerHTML = `<div class="empty"><div class="big">🏁</div>A competição ainda não começou por aqui.<br>Assim que a primeira coleta rodar, o placar aparece.</div>`;
    return;
  }
  const deltas = v.closed ? {} : rankDeltas(v.daily_series, v.standings);
  main.innerHTML = [
    totalsHTML(v),
    podiumHTML(v, deltas),
    boardHTML(v),
    rankingsHTML(v),
    topVideosHTML(v),
    menteesHTML(v),
    warningsHTML(v),
    rulesHTML(v),
  ].join("");
}

/* ── eventos ──────────────────────────────── */
document.addEventListener("click", e => {
  const chip = e.target.closest(".m-chip");
  if (chip) { state.month = chip.dataset.month; render(); return; }
  const tab = e.target.closest(".rk-tab");
  if (tab) { state.rkTab = tab.dataset.rk; render(); return; }
  const more = e.target.closest("[data-more]");
  if (more) {
    const key = more.dataset.more + "Open";
    state[key] = !state[key];
    const card = more.closest(".card");
    const top = card && !state[key] ? card.getBoundingClientRect().top : null;
    render();
    // ao recolher, mantém o card na mesma posição da tela (não "salta" pro rodapé)
    if (top !== null) {
      const again = [...document.querySelectorAll(".card")].find(c => c.querySelector(`[data-more="${more.dataset.more}"]`));
      if (again) window.scrollBy(0, again.getBoundingClientRect().top - top);
    }
    return;
  }
  const row = e.target.closest(".row-main");
  if (row) {
    const tr = row.closest("tr");
    tr.classList.toggle("open");
    row.setAttribute("aria-expanded", tr.classList.contains("open"));
  }
});
$("#theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});

/* ── boot ─────────────────────────────────── */
state.month = DATA.current.month;
renderUpdated();
setInterval(renderUpdated, 60000);
render();
</script>
